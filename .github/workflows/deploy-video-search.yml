name: Deploy LOOPA video search
on: workflow_dispatch
permissions:
  contents: read
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Verify tests
        run: node --test tests/*.test.cjs
      - name: Install Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.54.11
      - name: Deploy video-search
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: supabase functions deploy video-search --project-ref wnubqzwsvclvcvozibtc --use-api --yes
