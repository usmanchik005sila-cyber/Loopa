name: Deploy LOOPA video search
on: workflow_dispatch
permissions: {}
concurrency:
  group: video-search-deployment
  cancel-in-progress: false
jobs:
  deploy:
    if: github.repository == 'usmanchik005sila-cyber/Loopa' && github.ref == 'refs/heads/main'
    environment: supabase-production
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
      - name: Verify tests
        run: node --test tests/*.test.cjs
      - name: Install Supabase CLI
        uses: supabase/setup-cli@1dedf2c611547ede7232d26866dd3c56ab903bbb # v1
        with:
          version: 2.54.11
      - name: Deploy video-search
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.LOOPA_SUPABASE_DEPLOY_TOKEN }}
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "Environment secret LOOPA_SUPABASE_DEPLOY_TOKEN is missing"
            exit 1
          fi
          supabase functions deploy video-search --project-ref wnubqzwsvclvcvozibtc --use-api --yes
