name: Verify schema bootstrap

on:
  pull_request:
    paths:
      - 'supabase/bootstrap/**'
      - 'tests/*.sql'
      - '.github/workflows/verify-schema-bootstrap.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - run: bash supabase/bootstrap/verify.sh
