name: Deploy protected RUTUBE bridge
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/deploy-rutube-bridge.yml', 'yandex/rutube-search/**']
permissions:
  contents: read
concurrency:
  group: rutube-bridge-deployment
  cancel-in-progress: false
jobs:
  deploy:
    if: github.repository == 'usmanchik005sila-cyber/Loopa' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: yandex/rutube-search/go.mod
          cache: false
      - name: Test RUTUBE bridge
        working-directory: yandex/rutube-search
        run: go test ./...
      - name: Preserve rollback and deploy verified code
        env:
          YC_SA_JSON_CREDENTIALS: ${{ secrets.YC_SA_JSON_CREDENTIALS }}
        shell: bash
        run: |
          python3 - <<'PYCODE'
          import base64
          import io
          import json
          import os
          import subprocess
          import tempfile
          import time
          import urllib.error
          import urllib.request
          import zipfile
          
          SA_ID = 'ajejjebhmvkkfhjg5vo4'
          FUNCTION_ID = 'd4e8n1se4iuc8ql4rm82'
          IAM_URL = 'https://iam.api.cloud.yandex.net/iam/v1/tokens'
          API_URL = 'https://serverless-functions.api.cloud.yandex.net/functions/v1'
          
          class ProbeError(Exception):
              pass
          
          def b64(value):
              return base64.urlsafe_b64encode(value).rstrip(b'=').decode()
          
          def request_json(url, stage, payload=None, token=None):
              headers = {'Content-Type': 'application/json'}
              if token:
                  headers['Authorization'] = 'Bearer ' + token
              body = None if payload is None else json.dumps(payload).encode()
              request = urllib.request.Request(url, data=body, headers=headers)
              try:
                  with urllib.request.urlopen(request, timeout=30) as response:
                      return json.load(response)
              except urllib.error.HTTPError as error:
                  # Never echo a remote error body: it may contain credentials/configuration.
                  raise ProbeError(f'{stage}: HTTP {error.code}') from None
              except Exception:
                  raise ProbeError(f'{stage}: network or response error') from None
          
          def main():
              raw = os.environ.get('YC_SA_JSON_CREDENTIALS', '')
              if not raw:
                  raise ProbeError('Repository secret YC_SA_JSON_CREDENTIALS is missing or empty')
              try:
                  key = json.loads(raw)
                  if key.get('service_account_id') != SA_ID:
                      raise ProbeError('The key belongs to a different service account')
                  private_key = key['private_key']
                  kid = key['id']
                  if not isinstance(private_key, str) or not isinstance(kid, str):
                      raise ValueError()
              except ProbeError:
                  raise
              except Exception:
                  raise ProbeError('Secret must contain the full authorized-key JSON, including private_key') from None
              now = int(time.time())
              header = b64(json.dumps({'alg': 'PS256', 'typ': 'JWT', 'kid': kid}).encode())
              payload = b64(json.dumps({'iss': SA_ID, 'aud': IAM_URL, 'iat': now, 'exp': now + 300}).encode())
              unsigned = (header + '.' + payload).encode()
              with tempfile.TemporaryDirectory(prefix='yc-probe-') as directory:
                  path = os.path.join(directory, 'key.pem')
                  fd = os.open(path, os.O_WRONLY | os.O_CREAT | os.O_EXCL, 0o600)
                  with os.fdopen(fd, 'w') as handle:
                      handle.write(private_key)
                  signed = subprocess.run(['openssl', 'dgst', '-sha256', '-sign', path,
                                           '-sigopt', 'rsa_padding_mode:pss',
                                           '-sigopt', 'rsa_pss_saltlen:32'],
                                          input=unsigned, capture_output=True)
                  if signed.returncode:
                      raise ProbeError('Cannot sign with this key; use an authorized RSA service-account key')
              jwt_value = unsigned.decode() + '.' + b64(signed.stdout)
              token_data = request_json(IAM_URL, 'IAM authentication', {'jwt': jwt_value})
              token = token_data.get('iamToken')
              if not isinstance(token, str) or not token:
                  raise ProbeError('IAM authentication: token missing')
              function = request_json(API_URL + '/functions/' + FUNCTION_ID, 'Read function', token=token)
              if function.get('id') != FUNCTION_ID:
                  raise ProbeError('Unexpected function response')
              return token, read_latest(token)

          def read_latest(token):
              versions = request_json(API_URL + '/versions?functionId=' + FUNCTION_ID + '&pageSize=1000',
                                      'Read function versions', token=token).get('versions', [])
              latest = next((v for v in versions if '$latest' in v.get('tags', [])), None)
              if latest is None:
                  raise ProbeError('No $latest version found; probe stopped without changing the function')
              return request_json(API_URL + '/versions/' + latest['id'], 'Read runtime configuration', token=token)

          def source_content():
              archive = io.BytesIO()
              with zipfile.ZipFile(archive, 'w', zipfile.ZIP_DEFLATED) as package:
                  for name in ('index.go', 'go.mod'):
                      package.write('yandex/rutube-search/' + name, name)
              return base64.b64encode(archive.getvalue()).decode()

          def smoke_status(body, headers):
              req = urllib.request.Request('https://functions.yandexcloud.net/' + FUNCTION_ID,
                                           data=body, headers={'Content-Type': 'application/json', **headers})
              try:
                  with urllib.request.urlopen(req, timeout=45) as response:
                      return response.status
              except urllib.error.HTTPError as error:
                  return error.code

          def wait_operation(operation,token):
              for _ in range(120):
                  if operation.get('done'):
                      if operation.get('error'):raise ProbeError('Cloud operation failed; details suppressed')
                      return operation.get('response',{})
                  time.sleep(5)
                  operation=request_json('https://operation.api.cloud.yandex.net/operations/'+operation['id'],'Wait cloud operation',token=token)
              raise ProbeError('Cloud operation timed out; inspect the operation before retrying')
          
          def deploy():
              token,old=main()
              if old.get('runtime') != 'golang123' or old.get('entrypoint') != 'index.Handler':
                  raise ProbeError('Unexpected runtime or entrypoint; refusing to replace it')
              fields=['runtime','entrypoint','resources','executionTimeout','concurrency','logOptions','metadataOptions']
              config={k:old[k] for k in fields if k in old}
              # Do not silently lose configuration not supported by this deployment workflow.
              if any(old.get(k) for k in ['environment','serviceAccountId','secrets','connectivity','namedServiceAccounts','storageMounts','mounts','asyncInvocationConfig']):
                  raise ProbeError('Unexpected additional configuration; refusing to replace it')
              tag = 'rollback-' + old['id']
              wait_operation(request_json(API_URL+'/versions/'+old['id']+':setTag',
                                          'Preserve rollback',{'tag':tag},token),token)
              if read_latest(token)['id'] != old['id']:
                  raise ProbeError('Latest version changed; refusing to overwrite it')
              config.update({'functionId': FUNCTION_ID, 'description': 'LOOPA RUTUBE bridge',
                             'content': source_content()})
              print('Rollback version retained: '+old['id'],flush=True)
              response=wait_operation(request_json(API_URL+'/versions','Create protected version',config,token),token)
              new_id=response.get('id')
              print('Created protected version: '+str(new_id),flush=True)
              try:
                  if smoke_status(b'{"q":"nature","page":1}', {}) != 401:
                      raise ProbeError('Deployed authentication smoke check failed')
                  if smoke_status(b'{', {'X-Loopa-Authorization': 'Bearer smoke-fixture'}) != 400:
                      raise ProbeError('Deployed input validation smoke check failed')
                  print('DEPLOY_OK: missing authorization returned 401 and invalid input returned 400',flush=True)
              except Exception:
                  rollback={k:old[k] for k in fields if k in old}
                  rollback.update({'functionId':FUNCTION_ID,'versionId':old['id'],'description':'Automatic rollback after RUTUBE smoke failure'})
                  wait_operation(request_json(API_URL+'/versions','Restore old version',rollback,token),token)
                  raise ProbeError('Smoke check failed; previous code restored') from None
          
          if __name__=='__main__':
              try:deploy()
              except ProbeError as e:
                  print('Deployment stopped: '+str(e));raise SystemExit(1)
              except Exception:
                  print('Deployment stopped: unexpected error; sensitive details suppressed');raise SystemExit(1)
          PYCODE
